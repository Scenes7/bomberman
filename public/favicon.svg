<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bomb">
  <!-- Dark plate so the black bomb stays visible on light and dark tab bars alike. -->
  <rect width="32" height="32" rx="7" fill="#16181d"/>
  <!-- Fuse and spark -->
  <path d="M20.5 9.5 Q25 6.5 26.5 3.5" stroke="#c8a26b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="27" cy="3.6" r="3.1" fill="#ffdf5a"/>
  <circle cx="27" cy="3.6" r="1.5" fill="#ff7a00"/>
  <!-- Cap, body, highlight -->
  <rect x="16.4" y="7.6" width="5.6" height="4.2" rx="1.2" fill="#3a3a3a" transform="rotate(38 19.2 9.7)"/>
  <circle cx="14" cy="19.5" r="9.2" fill="#0d0d0d"/>
  <circle cx="10.4" cy="15.8" r="2.5" fill="#ffffff" opacity="0.72"/>
</svg>
